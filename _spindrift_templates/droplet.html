<!DOCTYPE html>
<html class="droplet">
    <head>
        <meta charset="utf-8">
        <title>{{ title }}</title>
        <meta name="description" content="">
        <meta name="author" content="{{ meta.author }}">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="generator" content="spindrift">
        <link rel="stylesheet" href="../css/style.min.css" type="text/css" media="all">
    </head>
    <body class="droplet">
        <h2 class="droplet-heading">{{ title }}</h2>
        {% if meta.date is defined %}
        <span class="droplet-date">{{ meta.date }} - {{ meta.author }}</span>
        {% endif %}
        {{ content }}
        <div style="display:flex;justify-content:space-between;">
            <a class="droplet-back" href="index.html"><em>back</em></a>
            <a class="droplet-back" href="../index.html"><em>home</em></a>
        </div>
    </body>
</html>
