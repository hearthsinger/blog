title: On Posting
content: |
  Throwing out a diary entry here - these posts are just gonna be 
  stream-of-consciousness nonsense for the most part. Today I thought quite a 
  bit about posting and what to post and why we post and spent quite a bit of 
  time just,,, browsing the indieweb/smallweb/what-have-you.

  Part of me is here to have my "graphic design is my passion" moment, y'know?
  Like "oh look at me I'm a big girl web developer here's my bespoke website
  that uses all these tools I wrote myself and I don't have to worry about
  libraries and frameworks and bundlers and containers and deployment and
  devops and...."

  Clearly I'm, not going through any kind of professional angst right now. 

  None at all.

  But like really why **am** I here (_here_ as in posting not _here_ as in on this
  planet)? I do really believe what I wrote in the webring blurb on the 
  home page. I'm just so tired of how the internet is. I have social medias, 
  I'm no principled tech hermit that is free of the sin of doomscrolling. I've
  given megacorps rights to my output, my content, my posts, my analytics. But
  I am tired. Maybe one day I'll reach that ideological endpoint but for now,
  unfortunately, I do like looking at my 'puter because my friends are in there. 

  They're in there sending me Instagram reels that are just crops of twitter
  posts that are screenshots of tumblr posts with whatever clip of the tiktok
  trending audio of the month. The Content Ouroboros.

  But they're in there.

  In fact, they're not even really likely to be here at all. Some of the nerds
  and freaks (lovingly) I know, sure, but by and large the regular folks in my
  life aren't Logging On to their neocities pages to click around webrings,
  browse galleries of badges or interest groups. They're not learning how to
  spin up their own website just to have a way to prove to a webcrawler that,
  hey, we were friends, we loved each other.

  But we did. We do. In spite of The Horrors.

  The Horrors that drive us all to the centralized platforms, to a sense of 
  connection, community. The possibility that, if we're lucky, we can Post our
  way to the feelings we want. At sometimes we can! But when we do, John Discord
  or some other fuckass tech executive get's a little bit richer as we drive
  their active user metrics up.

  So for now, in addition to the pride of being able to post at a site that
  fits my little dumb web sensibilities, I'll post here. Not because it's
  likely to be seen, not because I'll reach most of my irl friends or acquaintances, 
  but because I'll feel far better about screaming into a void that doesn't
  drive the nightmare of the atomization of society ever forward, instead of
  one that does.
