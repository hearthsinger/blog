title: Masks Optional
content: |
  Where where you when the COVID-conscious lesbian bar in western Massachusetts
  became mask optional one day of the week?

  Did you remember the feel of the air around you? Did you feel your skin
  prickle in response to the chill of the wind?

  The weather's changing this week - a nor'easter is on the way. Did you hear?

  Were you holding someone you love when you heard about the polyamorous clown
  college? When a queer space was accused of eugenics, did you think of the 
  time you first laid eyes on a newborn relative?

  The election is coming up, it feels pretty safe here, but you never know. Did
  you get your vote-by-mail application in this year?

  When the discourse horseshoed back around, with right-wing outlets pushing the
  story to further their culture war, and the left began determining which
  community was doing praxis while the rest were self-congratulating
  moral-grandstanding worst-person-you'll-ever-meet-in-your-life narcissists,
  did you find yourself looking forward to the weekend?

  It was pretty scary when we got approached last night while we were getting a
  breath of fresh air outside the venue. You still don't think you look cute but
  the chasers and creeps have been out in numbers recently.

  I hope that woman that's living out of her car gets through this okay. Did you
  see the graffiti someone did at that private equity-owned coffee place down
  the street?
