title: Hello World
content: >
  **Hello, World!**

  This is the obligatory inaugural post in everyone's random neocities blog.
  I've got a bit about me in the [about](https://hart.moe/about.html) page, so
  I'll skip it here.
  Largely, I wanted to create this space just to have a bit of a place where I
  can jot down those thoughts that don't really fit into my internet presence as
  cultivated on one of the many extant massive platforms.

  To some extent, I'm hoping that this will be a "limitations breed creativity"
  situation - the blog portion of this site is generated via my own little toy
  static site generator, and so all of the functionality here is as good as I'm
  able and willing to make it.
  At some point I may sit down and cover exactly how this is all stitched
  together, but for now, just know that it's mostly duct tape and bubblegum.

  If I were a smarter person I'd probably leave some indication as to what
  you might expect to see here at some point in the future but frankly I'm not
  even sure at this point. Potentially rants about technology, games,
  photography, music, hardware, the internet, and potentially anything else.

  Maybe one of these days I'll tackle my RSS feed TODO...
