repos:
  - repo: local
    hooks:
      - id: prettier
        name: validate formatting
        language: system
        files: \.(js|html|md|scss)$
        entry: |
          bash -c 'npm run fix:prettier "${@}"' --
        stages: [pre-commit]
      - id: sass
        name: minify css with sass
        language: system
        files: \.(scss)$
        entry: |
          bash -c 'npm run gen:minify'
        stages: [pre-commit]
